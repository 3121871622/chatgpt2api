# 倾梦GPT · Nginx 反向代理配置片段（宝塔 / 1Panel 通用）
#
# 作用：
# 1) 解除大文件上传限制（旧库导入常见 200–300MB，默认 1m/50m 会直接 413）
# 2) 关闭缓冲、拉长超时，避免 SSE / 图片长任务被 502/503/504
# 3) 保留真实客户端 IP
#
# 用法：宝塔 → 网站 → 设置 → 配置文件，在 server { } 内加入下面的 location / 段，
#       然后 nginx -t && systemctl reload nginx。

location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # 旧库上传：按需调整，2G 足够覆盖 300MB 数据库
    client_max_body_size 2048m;
    client_body_timeout 600s;

    # 大文件直接转发，不先落盘到 Nginx 临时目录
    proxy_request_buffering off;

    # SSE / 流式对话必须关闭缓冲，否则前端会“卡住不出字”
    proxy_buffering off;
    proxy_cache off;

    # 图片生成、长对话、批量操作都可能超过默认 60s
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # WebSocket（如果需要）
    proxy_set_header Upgrade $http_upgrade;
}

# 如果前面还有一层 CDN / 负载均衡，同样要把它的请求体上限调到 2G，
# 并关闭响应缓冲，否则 413/502 会出现在 CDN 层而不是 Nginx。
