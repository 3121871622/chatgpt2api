# 倾梦GPT绘画企业级百万号池系统 · 默认 Compose
#
# 本文件与 docker-compose.qingmeng.yml 内容一致，保持二者同步：
#   docker compose up -d            # 默认入口
#   docker compose -f docker-compose.qingmeng.yml up -d
#
# 使用前：cp .env.qingmeng.example .env 并填写 QINGMENG_AUTH_KEY。

services:
  app:
    image: ${QINGMENG_IMAGE:-qingmeng/qingmeng-gpt:1.9.13}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: qingmeng-gpt
    restart: unless-stopped
    ports:
      - "${QINGMENG_PORT:-3000}:80"
    volumes:
      - ./data:/data
      - ./config.json:/opt/qingmeng/config.json:ro
      # 可选：挂入旧版数据目录，容器首次启动会自动识别并迁移（目标库已有账号则跳过）
      # - /www/dk_project/dk_app/chatgptapi/data:/legacy:ro
    environment:
      QINGMENG_AUTH_KEY: ${QINGMENG_AUTH_KEY:?请在 .env 中设置 QINGMENG_AUTH_KEY}
      QINGMENG_BASE_URL: ${QINGMENG_BASE_URL:-}
      QINGMENG_DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL:-}
      TZ: ${TZ:-Asia/Shanghai}
      # 自动迁移开关：1 开启（默认），0 关闭
      QINGMENG_AUTO_MIGRATE: ${QINGMENG_AUTO_MIGRATE:-1}
      # 旧库目录（多个用 : 分隔）；不填也会自动探测 /legacy、/legacy-data、/old-data、/app/data、/data/legacy
      QINGMENG_LEGACY_DIRS: ${QINGMENG_LEGACY_DIRS:-/legacy}
      # 并发与调度全部在网页「设置 → 智能调度与维护」中配置，这里不再设置线程数。
    dns:
      - 223.5.5.5
      - 1.1.1.1
    dns_opt:
      - timeout:2
      - attempts:3
    dns_search: []
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/version >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  postgres:
    image: postgres:16-alpine
    container_name: qingmeng-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qingmeng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qingmeng}
      POSTGRES_DB: ${POSTGRES_DB:-qingmeng}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qingmeng}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes: {}
